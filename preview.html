<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3TRIO Preview</title><style>body{margin:0;background:#09090d;color:#fff;font-family:system-ui}.app{max-width:430px;margin:auto;min-height:100vh;padding-bottom:80px}.top{padding:20px;display:flex;justify-content:space-between;position:sticky;top:0;background:#0d0d12ee}.logo{font-weight:900;font-size:25px;letter-spacing:3px}.page{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{height:270px;border-radius:18px;overflow:hidden;position:relative}.card img{width:100%;height:100%;object-fit:cover}.info{position:absolute;bottom:0;padding:12px;width:100%;background:linear-gradient(transparent,#000)}.nav{position:fixed;bottom:0;width:min(430px,100%);height:70px;background:#15151bee;display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#aaa}.nav button.on{color:#ff3f78}.btn{background:#ff3f78;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700}.row{padding:15px;border:1px solid #292933;border-radius:15px;margin:9px 0;background:#14141b}.map{height:550px;border-radius:20px;background:linear-gradient(135deg,#24303d,#111820);position:relative}.pin{position:absolute;background:#fff;color:#111;padding:7px 10px;border-radius:10px}.chat{height:520px}.bubble{display:block;background:#25252f;padding:10px;margin:8px;border-radius:14px;width:max-content;max-width:75%}.mine{margin-left:auto;background:#ff3f78}.composer{display:flex;gap:8px}.composer input{flex:1;padding:12px;background:#181820;border:1px solid #333;color:#fff;border-radius:12px}</style></head><body><div class="app"><div class="top"><div class="logo">3TRIO</div><button class="btn" onclick="premium()">✦ Premium</button></div><main id="p" class="page"></main><div class="nav"><button id="d" onclick="go('d')">⌖<br>Discover</button><button id="f" onclick="go('f')">◉<br>Feed</button><button id="m" onclick="go('m')">⌖<br>Map</button><button id="l" onclick="go('l')">♥<br>Likes</button><button id="c" onclick="go('c')">☵<br>Chat</button></div></div><script>
const ps=[['Alex & Sam','29 · 31','https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=800'],['Maya','28','https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=800'],['Jordan','30','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800'],['Taylor','27','https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=800']];let msgs=['Hey 👋','Hi, nice to meet you.'];
function go(x){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));document.getElementById(x).classList.add('on');let h='';if(x==='d')h='<h1>Discover</h1><p>Verified people and couples near you</p><div class="grid">'+ps.map((p,i)=>'<div class="card" onclick="profile('+i+')"><img src="'+p[2]+'"><div class="info"><b>'+p[0]+' ✓</b><br><small>'+p[1]+' · Verified</small></div></div>').join('')+'</div>';if(x==='f')h='<h1>Community Feed</h1><div class="row"><b>3TRIO Community</b><p>Meet openly. Connect intentionally. Keep it respectful and consensual.</p><img style="width:100%;border-radius:14px" src="https://images.unsplash.com/photo-1517457373958-b7bdd4587205?w=900"><button class="btn" onclick="alert(\'Liked\')">♥ Like</button></div>';if(x==='m')h='<h1>Nearby Map</h1><p>Approximate locations only — exact GPS is never exposed.</p><div class="map"><span class="pin" style="left:12%;top:20%">Alex & Sam</span><span class="pin" style="left:60%;top:40%">Maya</span><span class="pin" style="left:32%;top:68%">Jordan</span></div>';if(x==='l')h='<h1>Likes & Pings</h1><div class="row">♥ Someone nearby liked you</div><div class="row">⚡ Sam sent a Ping</div><div class="row"><b>3TRIO Premium</b><p>Unlimited likes · See who liked you · Premium filters</p><button class="btn" onclick="premium()">View plans</button></div>';if(x==='c')h='<h1>Messages</h1><div class="row" onclick="go(\'chat\')">👥 <b>Alex & Sam</b><br><small>Protected chat</small></div>';if(x==='chat')h='<h1>Protected Chat</h1><div class="chat" id="msgs">'+msgs.map((v,i)=>'<div class="bubble '+(i%2?'mine':'')+'">'+v+'</div>').join('')+'</div><div class="composer"><input id="msg" placeholder="Message…"><button class="btn" onclick="send()">Send</button></div>';document.getElementById('p').innerHTML=h}
function profile(i){let p=ps[i];document.getElementById('p').innerHTML='<h1>'+p[0]+' ✓</h1><img style="width:100%;border-radius:18px" src="'+p[2]+'"><p>'+p[1]+' · Verified</p><p>Open-minded, respectful and here for genuine connections.</p><button class="btn" onclick="alert(\'Like sent\')">♥ Like</button>'}
function premium(){document.getElementById('p').innerHTML='<h1>3TRIO Premium</h1><p>Unlimited likes · See who liked you · Premium filters</p><div class="row">Monthly · ₹500 <button class="btn">Choose</button></div><div class="row">6 months · ₹2,500 <button class="btn">Choose</button></div><div class="row">Yearly · ₹4,000 <button class="btn">Choose</button></div>'}
function send(){let x=document.getElementById('msg');if(x.value.trim()){msgs.push(x.value.trim());go('chat')}}
go('d');
</script></body></html>
