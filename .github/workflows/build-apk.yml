name: Build 3TRIO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.threetrio .

      - name: Align Kotlin Gradle plugin
        run: sed -i 's/2.1.0/2.4.20/g' android/settings.gradle.kts

      - name: Remove generated test
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3trio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

# trigger rebuild
