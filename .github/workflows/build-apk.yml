name: Build 3TRIO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.threetrio .
      - name: Align Kotlin Gradle plugin
        run: sed -i 's/2.1.0/2.4.20/g' android/settings.gradle.kts
      - name: Fix Android JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          lines = p.read_text().splitlines()
          out = []
          skip = False
          depth = 0
          for line in lines:
              if not skip and 'kotlinOptions {' in line:
                  skip = True
                  depth = line.count('{') - line.count('}')
                  continue
              if skip:
                  depth += line.count('{') - line.count('}')
                  if depth <= 0:
                      skip = False
                  continue
              out.append(line)
          s = '\n'.join(out) + '\n'
          s = s.replace('JavaVersion.VERSION_11', 'JavaVersion.VERSION_17')
          p.write_text(s)
          PY
          grep -n -E 'kotlinOptions|jvmTarget|sourceCompatibility|targetCompatibility' android/app/build.gradle.kts || true
      - name: Remove generated test
        run: rm -rf test
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3trio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
