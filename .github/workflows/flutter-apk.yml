name: 3TRIO Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name=three_trio .
      - run: sed -i 's/2.1.0/2.4.20/g' android/settings.gradle.kts
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: 3trio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
